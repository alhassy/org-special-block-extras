name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: 30.1

      # Tests load snap via "~/snap/snap.el" and modules via "~/org-special-block-extras/…"
      - name: Fetch snap and place repo where tests expect it
        run: |
          git clone --depth 1 https://github.com/alhassy/snap ~/snap
          git clone --depth 1 https://github.com/alhassy/fancy-C-x-C-e ~/fancy-C-x-C-e
          ln -s "$GITHUB_WORKSPACE" ~/org-special-block-extras

      # WordNet's wn, for doc:𝒳 links to English words; LuaLaTeX, our LaTeX packages, and ulem (of plain-generic),
      # which Org's own default LaTeX header loads, for the PDF test.
      - name: Install WordNet and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wordnet latexmk texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-plain-generic

      # Org 9.8 from GNU ELPA, as the package requires; Emacs 30.1 bundles an older Org, which it will not upgrade unasked.
      - name: Install Org and MELPA dependencies
        run: |
          emacs --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (setq package-install-upgrade-built-in t)
            (package-initialize) (package-refresh-contents)
            (dolist (p '(org dash s lf undercover)) (package-install p))
            (message \"Org %s\" (progn (require 'org) org-version)))"

      - name: Run tests
        run: |
          emacs --batch --eval "(package-initialize)" -L lisp -L ~/snap -L ~/fancy-C-x-C-e \
            $(for f in tests/*-tests.el tests/graph/*-tests.el; do echo "-l $f"; done) \
            -f ert-run-tests-batch-and-exit

      # Informational, not a gate: undercover re-runs the tests with every source file instrumented,
      # then prints each file's percentage of lines run.  Edebug cannot instrument org-deftag.el, so it goes unmeasured.
      - name: Report coverage
        continue-on-error: true
        env:
          UNDERCOVER_FORCE: true
        run: |
          emacs --batch --eval "(package-initialize)" -L lisp -L ~/snap -L ~/fancy-C-x-C-e \
            --eval "(progn (require 'undercover) (undercover \"lisp/*.el\" (:report-format 'text) (:send-report nil)))" \
            $(for f in tests/*-tests.el tests/graph/*-tests.el; do echo "-l $f"; done) \
            -f ert-run-tests-batch-and-exit 2>&1 | sed -n '/Code coverage text report/,$p'
