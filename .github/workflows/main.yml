name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: 30.1

      # Tests load snap via "~/snap/snap.el" and modules via "~/org-special-block-extras/…"
      - name: Fetch snap and place repo where tests expect it
        run: |
          git clone --depth 1 https://github.com/alhassy/snap ~/snap
          git clone --depth 1 https://github.com/alhassy/fancy-C-x-C-e ~/fancy-C-x-C-e
          ln -s "$GITHUB_WORKSPACE" ~/org-special-block-extras

      - name: Install MELPA dependencies
        run: |
          emacs --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-initialize) (package-refresh-contents)
            (dolist (p '(dash s lf)) (package-install p)))"

      - name: Run tests
        run: |
          emacs --batch --eval "(package-initialize)" -L . -L ~/snap -L ~/fancy-C-x-C-e \
            $(for f in tests/*-tests.el tests/examples/*.el; do echo "-l $f"; done) \
            -f ert-run-tests-batch-and-exit
